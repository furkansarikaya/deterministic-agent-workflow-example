default_mode: deterministic
default_profile: core
# Execution topology is a separate concept from agent role (full_lifecycle /
# implementation_worker): it says whether a run needs a second, delegated
# implementation owner at all. `standalone` — the active full_lifecycle
# agent (Claude, Codex, or any other vendor — the control plane does not
# care) implements its own RED/GREEN evidence. `orchestrated` — full_lifecycle
# delegates RED/GREEN/REFACTOR/fix implementation to implementation_worker
# and must not implement application code itself. A run's own RUN.yaml
# (execution.topology) may override this per run; this is only the
# repository-wide default a new run inherits when it does not. This
# reference repository defaults to `standalone` as the least-surprising
# choice — it demonstrates the full lifecycle without requiring a second
# vendor/tool to be configured. See .agents/WORKFLOW.md's "Execution
# topology" section.
default_topology: standalone
active_run_file: .agents/ACTIVE_RUN
# Checked-in template state: ACTIVE_RUN is empty. A real task explicitly sets one ID.
policy_source: .agents/modes
# Single authoritative source for the canonical integration branch. A deterministic
# task run must never implement directly on this branch; see .agents/GIT.md.
canonical_branch: main
# The explicit Transaction B (knowledge transaction) scope boundary — a single
# repository-relative directory prefix (trailing slash required). A path under
# this root is never part of a run's frozen PLAN.md (Transaction A/application)
# scope; it is validated separately by `agent.sh verify-knowledge-scope`, gated
# on `execution.knowledge_state` being recorded `KNOWLEDGE_DONE`/`not_applicable`
# (see .agents/WORKFLOW.md's "Knowledge transaction scope" section). This is a
# deliberate allowlist, not "everything verify_scope doesn't recognize" — a path
# outside this root is always evaluated as application scope, never as knowledge
# scope, no matter what a run's knowledge_state says.
knowledge_scope_root: docs/wiki/
safety:
  destructive_git_requires_explicit_authorization: true
  external_network_requires_task_authorization: true
  dependency_changes_require_task_authorization: true
# Task classification selects the lifecycle (see .agents/WORKFLOW.md "Pipeline
# selection"). Every key here is consumed by scripts/agent.sh:
#   evidence         EVIDENCE.md is produced and frozen
#   qa               QA_PLAN.md is produced and frozen, and the QA gate is required
#   review           yes | no | optional (STANDARD: opted in per run by `classify <ID> STANDARD review`)
#   architect        PLAN.md must carry an `## Architecture` section
#   max_explorers    bound on parallel Explorer assignments (policy-only; see .agents/ENFORCEMENT.md)
#   max_scope_paths  hard bound on PLAN.md scope paths (a bigger change is not this class)
# The VERIFY gate is required for every class. Bounded remediation is
# `verification.max_bounded_fix_attempts` in the mode policy, for every class.
pipelines:
  TRIVIAL:
    evidence: no
    qa: no
    review: no
    architect: no
    max_explorers: 0
    max_scope_paths: 2
  STANDARD:
    evidence: yes
    qa: yes
    review: optional
    architect: no
    max_explorers: 1
  COMPLEX:
    evidence: yes
    qa: yes
    review: yes
    architect: yes
    max_explorers: 2
  CRITICAL:
    evidence: yes
    qa: yes
    review: yes
    architect: yes
    max_explorers: 3
# Execution policy: the ONE place a run's model, reasoning effort, context budget,
# cache strategy, planning depth, delegation, validation depth and retry/escalation
# limits are decided. scripts/exec-policy.sh is the only resolver; `agent.sh decide`
# is its only caller and records one decision per attempt; scripts/worker-run.sh
# consumes that decision and never chooses these values itself. Task class (the
# `pipelines:` block above) stays the primary input. See .agents/WORKFLOW.md
# "Execution policy". Values below are plain scalars (no trailing comments).
execution_policy:
  # Policy SEMANTICS version. Bump it when resolution, precedence or escalation
  # behavior changes; NOT for editing this inventory (models, tiers, budgets).
  revision: 1
  # Hard safety ceilings. Neither task policy nor an operator override can exceed them.
  # Retry attempts are not repeated here: they are verification.max_bounded_fix_attempts.
  hard:
    max_escalations: 2
    max_delegation: 3
    max_context_bytes: 262144
    forbidden_efforts: ultra
  # Deterministic task evidence beyond the class: PLAN.md scope paths.
  evidence:
    sensitive_paths: .agents/ scripts/
    wide_scope_paths: 8
  # Per class: minimum sufficient model tier (position in the provider ladder below),
  # base reasoning effort and base dynamic-context budget in bytes.
  classes:
    TRIVIAL: tier=1 effort=low context_bytes=16384
    STANDARD: tier=2 effort=medium context_bytes=49152
    COMPLEX: tier=2 effort=high context_bytes=98304
    CRITICAL: tier=3 effort=xhigh context_bytes=163840
  effort_order: low medium high xhigh max
  # Only the implementation_worker adapter is repository-controllable. Under
  # `standalone` the full_lifecycle session owns its own model/effort; nothing here
  # can change a running session, so the decision records that instead of guessing.
  # Ladder = cheapest to strongest, operator-declared; capabilities were verified
  # against `codex exec --help` and ~/.codex/models_cache.json (`exec-policy.sh
  # check-capabilities` re-verifies them). `ultra` (automatic delegation) is
  # supported by some models but forbidden above.
  providers:
    codex:
      role: implementation_worker
      cache_control: none
      context_window_tokens: 272000
      models:
        gpt-5.6-luna: efforts=low,medium,high,xhigh,max
        gpt-5.6-terra: efforts=low,medium,high,xhigh,max
        gpt-5.6-sol: efforts=low,medium,high,xhigh,max
  # Stable, run-independent files that form the cacheable prefix of a worker prompt.
  context:
    stable: .agents/ENGINEERING.md .agents/VERIFICATION.md
