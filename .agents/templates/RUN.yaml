# `agent.sh baseline <TASK-ID>` replaces this pending block with captured
# base-SHA and file fingerprints; it never stores file contents.
task:
  id: <TASK-ID>

repository:
  base_sha: PENDING
  canonical_branch: PENDING
  task_branch: PENDING

task_source:
  type: local_markdown
  path: <REPOSITORY-RELATIVE-TASK-SOURCE.md>
  revision: PENDING
  # Presence of this key makes `revision` a hash of the frozen task *contract*
  # (the task source minus its `**Status:**` value and its published
  # completion-report block), written only by freeze/refreeze; the file's
  # location changes only via `agent.sh task-source-relocate`. See
  # .agents/WORKFLOW.md's "Task-source contract". A run frozen before this policy
  # (EXAMPLE-001) has no such key and keeps its whole-file semantics.
  revision_scheme: contract

execution:
  mode: deterministic
  profile: core
  state: PLANNING
  knowledge_state: not_started
  # standalone | orchestrated, or PENDING to inherit .agents/config.yaml's
  # default_topology. See .agents/WORKFLOW.md's "Execution topology".
  topology: PENDING

baseline:
  status: pending

freeze:
  task_sha256: PENDING
  evidence_sha256: PENDING
  plan_sha256: PENDING
  policy_sha256: PENDING

handoff:
  state: PLANNED
  verification_patch_sha256: PENDING
  review_patch_sha256: PENDING
  code_done_patch_sha256: PENDING

# Presence of these three keys (not their values) is what makes a run subject
# to worker-evidence/TDD/completion-report enforcement — see agent.sh's
# `policy_enforced`/`historical_reference` pattern. A run frozen before this
# policy existed has none of these keys and is never retroactively edited to
# add them.
worker_evidence:
  required: true

tdd:
  required: true

completion_report:
  required: true
  adapter: PENDING
  published: false
  receipt: PENDING

# Presence of this key makes a run subject to the REVIEW/QA gate loop,
# tree-attested implementation ownership, the hash-chained lifecycle ledger
# (LEDGER.log) and the scripted `agent.sh amend` reopen — see agent.sh's
# `gates_enforced` and .agents/WORKFLOW.md's "Lifecycle gates". A run frozen
# before this policy existed (EXAMPLE-001) has no such key and is never
# retroactively edited to add one.
lifecycle_gates:
  required: true
