# Runtime state for one task (`.agents/runs/<TASK-ID>/`, disposable: .agents/WORKFLOW.md
# "Runtime artifacts"). Only lifecycle facts belong here. `agent.sh baseline` fills the baseline block.
task:
  id: <TASK-ID>

repository:
  base_sha: PENDING
  canonical_branch: PENDING
  task_branch: PENDING

task_source:
  type: local_markdown
  path: <REPOSITORY-RELATIVE-TASK-SOURCE.md>
  # Hash of the frozen task contract. Only freeze and refreeze write it.
  # See .agents/WORKFLOW.md "Task-source contract".
  revision: PENDING

execution:
  mode: deterministic
  profile: core
  state: PLANNING
  knowledge_state: not_started
  # standalone | orchestrated, or PENDING to inherit `default_topology` (.agents/config.yaml).
  topology: PENDING

# Written by `agent.sh classify`. It selects the frozen artifacts and the required gates
# (`pipelines:` in .agents/config.yaml). `agent.sh pipeline <TASK-ID>` prints them.
pipeline:
  classification: PENDING
  review: PENDING

baseline:
  status: pending

# `not_required` replaces a hash for an artifact the pipeline does not produce.
freeze:
  task_sha256: PENDING
  evidence_sha256: PENDING
  plan_sha256: PENDING
  qa_plan_sha256: PENDING
  policy_sha256: PENDING
  pipeline: PENDING

handoff:
  state: PLANNED
  implemented_patch_sha256: PENDING
  code_done_patch_sha256: PENDING

# The presence of these keys, not their values, subjects a run to worker-evidence, TDD and
# completion-report enforcement. `lifecycle_gates` adds the gates, attested tree ownership,
# the ledger and `agent.sh amend` (.agents/WORKFLOW.md "Quality gates and remediation").
worker_evidence:
  required: true

tdd:
  required: true

completion_report:
  required: true
  adapter: PENDING
  published: false
  receipt: PENDING

lifecycle_gates:
  required: true
